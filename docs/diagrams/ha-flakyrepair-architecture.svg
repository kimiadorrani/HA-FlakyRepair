<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 290" width="1050" height="290"
     font-family="Helvetica,Arial,sans-serif">
<defs>
  <marker id="arr"       markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#555"/></marker>
  <marker id="arr_red"   markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#b85450"/></marker>
  <marker id="arr_purple" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#9673a6"/></marker>
  <marker id="arr_teal"  markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#3a8fa8"/></marker>
</defs>

<rect x="0" y="0" width="1050" height="290" fill="white"/>

<!-- Title -->
<text x="525" y="26" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">HA-FlakyRepair — Architecture Overview</text>

<!-- LangGraph Orchestrator wrapper -->
<rect x="157" y="48" width="446" height="228" rx="12"
      fill="#f4f8f4" stroke="#5b7f57" stroke-width="1.5" stroke-dasharray="7,3"/>
<text x="173" y="63" font-size="10" font-weight="bold" fill="#5b7f57">LangGraph Orchestrator</text>

<!-- ══════ BOXES ══════ -->

<!-- Input -->
<rect x="20" y="88" width="115" height="52" rx="8" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
<text x="78" y="119" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Input</text>

<!-- Detection Agent -->
<rect x="165" y="88" width="145" height="52" rx="8" fill="#cfe2f3" stroke="#4f81a7" stroke-width="2"/>
<text x="238" y="119" font-size="12" font-weight="bold" fill="#1a4d6e" text-anchor="middle">Detection Agent</text>

<!-- Repair Agent -->
<rect x="443" y="88" width="145" height="52" rx="8" fill="#fff8e0" stroke="#bf9000" stroke-width="2"/>
<text x="516" y="119" font-size="12" font-weight="bold" fill="#7d5800" text-anchor="middle">Repair Agent</text>

<!-- Memory cylinder (below Repair Agent) -->
<ellipse cx="516" cy="182" rx="62" ry="10" fill="#c2e2ed" stroke="#3a8fa8" stroke-width="1.8"/>
<rect x="454" y="182" width="124" height="46" fill="#daf0f7" stroke="#3a8fa8" stroke-width="1.8"/>
<path d="M454,228 Q516,240 578,228" fill="#c2e2ed" stroke="#3a8fa8" stroke-width="1.8"/>
<text x="516" y="207" font-size="12" font-weight="bold" fill="#1a5f72" text-anchor="middle">Memory</text>
<text x="516" y="221" font-size="9" fill="#2a7a8f" text-anchor="middle">attempt history</text>

<!-- Accuracy Evaluation -->
<rect x="668" y="88" width="145" height="52" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="741" y="113" font-size="12" font-weight="bold" fill="#5b3472" text-anchor="middle">Accuracy</text>
<text x="741" y="129" font-size="12" font-weight="bold" fill="#5b3472" text-anchor="middle">Evaluation</text>

<!-- END -->
<rect x="868" y="88" width="90" height="52" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="913" y="119" font-size="12" font-weight="bold" fill="#274e13" text-anchor="middle">END</text>


<!-- ══════ ARROWS ══════ -->

<!-- Input → Detection -->
<line x1="135" y1="114" x2="161" y2="114" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

<!-- Detection → Repair (detection results passed) -->
<line x1="310" y1="114" x2="439" y2="114" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
<text x="374" y="106" font-size="9" fill="#555" text-anchor="middle">detection results</text>


<!-- Repair → Memory (attempt fails, straight down) -->
<line x1="516" y1="140" x2="516" y2="169" stroke="#3a8fa8" stroke-width="1.8" marker-end="url(#arr_teal)"/>
<text x="528" y="158" font-size="9" fill="#3a8fa8">fails</text>

<!-- Memory → Repair (retry loop, path goes left then up into left side of Repair) -->
<path d="M454,205 L420,205 L420,114 L443,114" fill="none" stroke="#3a8fa8" stroke-width="1.8" marker-end="url(#arr_teal)"/>
<text x="396" y="168" font-size="9" fill="#3a8fa8" text-anchor="middle">retry</text>
<text x="396" y="180" font-size="9" fill="#3a8fa8" text-anchor="middle">≤ 3 times</text>

<!-- Repair → Result Logger -->
<line x1="588" y1="114" x2="664" y2="114" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

<!-- Result Logger → END -->
<line x1="813" y1="114" x2="864" y2="114" stroke="#9673a6" stroke-width="2" marker-end="url(#arr_purple)"/>

</svg>
